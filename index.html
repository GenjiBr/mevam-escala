<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#02050C" />
<title>MEVAM Escala — Sistema de Louvor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  body {
    background: #02050C;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #F2F5FB;
    /* permite scroll vertical quando o teclado empurra o conteúdo */
    overflow-y: auto;
  }
  #root {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    min-height: 100dvh;
    position: relative;
  }

  /* ── Previne zoom ao focar inputs no iOS ── */
  input, textarea, select {
    font-size: 16px !important;
    /* safe-area já incluída no body */
  }
  /* hide scrollbar inside the phone for a clean look */
  .mevam-scroll::-webkit-scrollbar { width: 0; display: none; }
  .mevam-scroll { scrollbar-width: none; }

  /* horizontal chip strip */
  div::-webkit-scrollbar { height: 0; }

  @keyframes toastIn {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: rgba(242,245,251,0.32); }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
      <radialGradient id="g" cx="50%" cy="40%" r="70%">
        <stop offset="0%" stop-color="#5B7FFF"/>
        <stop offset="60%" stop-color="#0A1224"/>
        <stop offset="100%" stop-color="#02050C"/>
      </radialGradient>
    </defs>
    <rect width="200" height="200" fill="url(#g)"/>
    <rect x="60" y="80" width="80" height="22" fill="#fff"/>
    <text x="100" y="98" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="18" fill="#0A1224" letter-spacing="2">MEVAM</text>
    <text x="100" y="125" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="600" font-size="9" fill="#A8BBFF" letter-spacing="3">ESCALA · LOUVOR</text>
  </svg>
</template>
